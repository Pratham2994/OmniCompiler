[project]
name = "server"
version = "0.1.0"
description = "OmniCompiler backend: containerized multi-language execution, debugging, CFG extraction and breakpoint recommendation"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.109.2",
    "google-genai>=2.22",
    "httpx>=0.28.1",
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.0",
    "pygments==2.19.1",
    "python-dotenv==1.0.1",
    "scikit-learn>=1.4",
    "uvicorn==0.27.1",
    "websockets>=13,<15",
]

[project.scripts]
server = "server:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
